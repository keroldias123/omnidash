version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: omnidash-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: omnidash
      POSTGRES_PASSWORD: omnidash
      POSTGRES_DB: omnidash
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
